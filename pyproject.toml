[project]
name = "englishcardbot"
version = "0.1.0"
description = "Telegram bot for learning English words with quizzes"
readme = "README.md"
authors = [
    { name = "nikolai", email = "mr.nikolai.dmitrievich@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = [
    "alembic/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RET"]
