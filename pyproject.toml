[project]
name = "englishcardbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nikolai", email = "mr.nikolai.dmitrievich@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "sqlalchemy[asyncio]>=2.0.54",
]

[project.scripts]
englishcardbot = "englishcardbot:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
