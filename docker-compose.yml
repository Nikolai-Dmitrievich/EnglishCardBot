services:
  db:
    image: postgres:15-alpine
    container_name: english_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB__POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB__POSTGRES_DB:-english_card_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - bot_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english_bot_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB__POSTGRES_HOST: db
      DB__POSTGRES_PORT: "5432"
      BOT__PROXY: ""
      AI__ENABLED: ${AI__ENABLED:-true}
      # Native Ollama base URL (no /v1): the bot talks to /api/chat, which is
      # the only endpoint that honours "think": false for reasoning models.
      AI__OLLAMA_BASE_URL: http://ollama:11434
      AI__OLLAMA_MODEL: ${AI__OLLAMA_MODEL:-qwen3:8b}
      AI__REQUEST_TIMEOUT_SECONDS: ${AI__REQUEST_TIMEOUT_SECONDS:-60}
      AI__PROMPT_VERSION: ${AI__PROMPT_VERSION:-tutor_v1}
      AI__NUM_CTX: ${AI__NUM_CTX:-4096}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - bot_network

  ollama:
    image: ollama/ollama:latest
    container_name: english_bot_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bot_network

  ollama-init:
    image: ollama/ollama:latest
    container_name: english_bot_ollama_init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling model ${AI__OLLAMA_MODEL:-qwen3:8b}...' &&
      ollama pull ${AI__OLLAMA_MODEL:-qwen3:8b} &&
      echo 'Model downloaded successfully'
      "
    networks:
      - bot_network

volumes:
  pgdata:
    driver: local
  ollama_models:
    driver: local

networks:
  bot_network:
    driver: bridge
