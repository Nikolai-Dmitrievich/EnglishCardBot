services:
  db:
    image: postgres:15-alpine
    container_name: english_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB__POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB__POSTGRES_DB:-english_card_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__POSTGRES_USER:-postgres} -d ${DB__POSTGRES_DB:-english_card_bot}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - bot_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english_bot_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB__POSTGRES_HOST: db
      DB__POSTGRES_PORT: "5432"
      BOT__PROXY: ""
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

volumes:
  pgdata:
    driver: local

networks:
  bot_network:
    driver: bridge
